version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: dim_entity
    columns:
      - name: entity_id
        data_tests: [unique, not_null]

  - name: dim_account
    columns:
      - name: account_id
        data_tests: [unique, not_null]

  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: fct_gl
    description: Ledger lines from balanced journals, with natural-sign LC and EUR amounts.
    columns:
      - name: gl_line_id
        data_tests: [unique, not_null]
      - name: entity_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_entity')
                field: entity_id
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: posting_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: avg_rate_to_eur
        data_tests: [not_null]

  - name: fct_journal_exceptions
    columns:
      - name: journal_id
        data_tests: [unique, not_null]

  - name: fct_trial_balance
    columns:
      - name: period_end
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: avg_rate_to_eur
        data_tests: [not_null]

  - name: fct_budget_variance
    columns:
      - name: actual_rate
        data_tests: [not_null]
      - name: budget_rate
        data_tests: [not_null]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id

  - name: fct_ar_aging
    columns:
      - name: aging_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: ['0 Current', '1 1-30', '2 31-60', '3 61-90', '4 90+']
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

  - name: fct_dso
    columns:
      - name: dso_days
        data_tests: [not_null]

  - name: fct_variance_alerts
    description: Rolling 3-month variance alerts scored with a robust (median/MAD) z-score.
    columns:
      - name: is_alert
        data_tests: [not_null]
