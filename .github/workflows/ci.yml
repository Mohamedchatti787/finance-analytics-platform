name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 20% volume keeps CI fast; the detection-power tests skip themselves below full scale
      - name: Build everything (generate -> warehouse -> dbt build with tests -> reconcile -> forecast -> KPIs)
        run: python run_pipeline.py --scale 0.2 --skip-export

      - name: Test suite (unit, integration, DAX contract, mutation tests)
        run: pytest -q
